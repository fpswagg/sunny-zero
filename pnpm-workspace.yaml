allowBuilds:
  esbuild: true
  sharp: true
  # Prebuilt CPU binaries ship in the package; the script only fetches optional CUDA files.
  onnxruntime-node: false
  protobufjs: false
  # Optional native speed-ups with JS fallbacks, and a postinstall message: not needed.
  bufferutil: false
  utf-8-validate: false
  es5-ext: false
