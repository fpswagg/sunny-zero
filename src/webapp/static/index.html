<!doctype html>
<html lang="__LANG__" data-agent="__AGENT__" style="--accent:__ACCENT__;--ink:__INK__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__TITLE__">
<title>__TITLE__</title>
<link rel="manifest" href="/a/__AGENT__/manifest.webmanifest">
<link rel="icon" href="/a/__AGENT__/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/a/__AGENT__/icon-180.png">
<link rel="stylesheet" href="/a/__AGENT__/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/a/__AGENT__/voice.js" defer></script>
<script src="/a/__AGENT__/app.js" defer></script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="who">
      <span class="avatar"><img src="/a/__AGENT__/icon.svg" alt=""><i id="dot"></i></span>
      <div class="names"><b id="name">__TITLE__</b><span id="sub">…</span></div>
    </div>
    <button id="limitsBtn" class="icon-btn limits" type="button" aria-label="Credits" hidden></button>
    <button id="callBtn" class="icon-btn" type="button" aria-label="Call" hidden><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
    <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>
  <main id="thread" aria-live="polite">
    <div id="empty" hidden>
      <span class="avatar xl"><img src="/a/__AGENT__/icon.svg" alt=""></span>
      <h1>__TITLE__</h1>
      <p id="emptyDesc"></p>
      <button id="emptyCall" class="pill accent" type="button" hidden></button>
    </div>
  </main>
  <button id="toBottom" type="button" aria-label="Scroll down" hidden><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <div id="activity" hidden><span class="dots"><i></i><i></i><i></i></span><span id="activityText"></span><button id="stopBtn" type="button"></button></div>
  <footer id="composer">
    <div class="field"><textarea id="input" rows="1" autocomplete="off"></textarea></div>
    <button id="mic" class="round" type="button" aria-label="Dictate"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="send" class="round accent" type="button" aria-label="Send" hidden><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </footer>
  <div id="dictate" hidden>
    <div class="rec"><i></i><span id="dictTime">0:00</span></div>
    <div class="bars" id="dictBars"></div>
    <span id="dictHint"></span>
  </div>
</div>

<section id="call" hidden>
  <div class="call-top">
    <button id="callHide" class="icon-btn" type="button" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
    <div class="call-title"><b>__TITLE__</b><span id="callTimer">0:00</span></div>
    <button id="callSettings" class="icon-btn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="orb"></canvas>
    <span class="avatar orb-face"><img src="/a/__AGENT__/icon.svg" alt=""></span>
  </div>
  <p id="callState"></p>
  <div class="captions">
    <p id="capYou"></p>
    <p id="capAgent"></p>
  </div>
  <div id="callApproval"></div>
  <div class="seg" id="modeSeg" role="tablist">
    <button type="button" data-mode="auto"></button>
    <button type="button" data-mode="hold"></button>
  </div>
  <div class="call-controls">
    <button id="muteBtn" class="round big" type="button"><svg viewBox="0 0 24 24" class="i-on"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg viewBox="0 0 24 24" class="i-off"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M19 11a7 7 0 0 1-1.1 3.8M5 11a7 7 0 0 0 10.6 6M12 18v3"/></svg></button>
    <button id="stopTalk" class="round big" type="button"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
    <button id="talkBtn" class="talk" type="button"><span></span></button>
    <button id="hangBtn" class="round big danger" type="button"><svg viewBox="0 0 24 24"><path d="M3.7 14.6a13 13 0 0 1 16.6 0 1 1 0 0 1 .1 1.5l-1.8 1.8a1 1 0 0 1-1.3.1l-2.1-1.5a1 1 0 0 1-.4-.9l.1-1.7a10 10 0 0 0-5.8 0l.1 1.7a1 1 0 0 1-.4.9l-2.1 1.5a1 1 0 0 1-1.3-.1l-1.8-1.8a1 1 0 0 1 .1-1.5z"/></svg></button>
  </div>
  <p id="callHint" class="hint"></p>
</section>

<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="gate" hidden></div>
</body>
</html>
